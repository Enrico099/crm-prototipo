name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: API e web (lint, typecheck, testes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # O npm 11 não roda install scripts: o Prisma Client é gerado explicitamente
      - run: npm run prisma:generate -w @crm/api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Só dependências que vão para o runtime; altas e críticas quebram o build
      - name: Vulnerabilidades em dependências de produção
        run: npm audit --omit=dev --audit-level=high

  migracoes:
    name: Migrações em PostgreSQL real
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm_ci
          POSTGRES_DB: crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://crm:crm_ci@localhost:5432/crm
      DIRECT_URL: postgresql://crm:crm_ci@localhost:5432/crm
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npx prisma generate
      - name: Aplica as migrações do zero
        run: npx prisma migrate deploy
      - name: Banco migrado bate com o schema.prisma (sem drift)
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Seed roda sobre o schema atual
        run: npx tsx prisma/seed.ts

  motor:
    name: Motor de recomendação (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/ai-engine
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ai-engine/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  e2e:
    name: E2E (Playwright, com os três serviços)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm_ci
          POSTGRES_DB: crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://crm:crm_ci@localhost:5432/crm
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ai-engine/requirements*.txt
      - run: npm ci
      - run: npm run prisma:generate -w @crm/api
      - run: pip install -r apps/ai-engine/requirements.txt
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run e2e
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
