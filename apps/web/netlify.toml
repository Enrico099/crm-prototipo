# Deploy do front no Netlify (monorepo). No painel do Netlify:
#   Base directory:    (vazio, raiz do repositório)
#   Package directory: apps/web
# A API e o motor Python rodam fora do Netlify (ver docs/deploy.md).
# Variáveis de ambiente no Netlify: API_URL e ENVIO_CRON_TOKEN (obrigatórias) e
# AI_ENGINE_URL (usada para manter o motor acordado no horário comercial).

[build]
  command = "npm run build -w @crm/web"
  # Caminhos relativos ao base directory (a raiz do repositório)
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "apps/web/netlify/functions"

# Declarado explicitamente: no monorepo o Netlify não detecta o Next.js sozinho
[[plugins]]
  package = "@netlify/plugin-nextjs"
